name: Manual merge gate

# Does not run when a pull request opens. Running it from the Actions tab
# publishes the required "manual-approval" status, then merges that branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  gate:
    name: manual-approval
    runs-on: ubuntu-latest
    steps:
      - name: Publish the required status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=manual-approval \
            -f description="Manually approved"

  merge:
    needs: gate
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            echo "No open pull request from ${GITHUB_REF_NAME} into main."
            exit 1
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --merge
